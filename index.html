  <body>
    <header class="topbar">
      <div class="brand">
        <h1>OMNIFÓN</h1>
        <p class="brand-meta">
          <span id="brand-subtitle">Raúl Pavón Sarrelangue · México · c. 1960</span>
          <span class="meta-sep">·</span>
          <span class="brand-credit">
            <span id="credit-by">Recreación virtual por</span>
            <a href="https://www.instagram.com/laurorobles/" target="_blank" rel="noopener noreferrer">@laurorobles</a>
          </span>
        </p>
      </div>

      <button id="open-info" class="bar-btn info-btn" type="button">
        <span class="info-icon" aria-hidden="true">i</span>
        <span id="info-label">Información</span>
      </button>

      <button id="open-manual" class="bar-btn manual-btn" type="button">
        <svg class="nav-svg-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
          <path d="M6 6h10"></path>
          <path d="M6 10h10"></path>
        </svg>
        <span id="manual-label">Manual</span>
      </button>

      <a id="vst-download-link" class="bar-btn gh-link-btn vst-dl-btn" href="https://github.com/laurorobles/Omnifon/releases/latest" target="_blank" rel="noopener noreferrer" title="Descargar Plugin VST3 / AU / Standalone">
        <svg class="nav-svg-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span id="vst-dl-label">VST / AU</span>
      </a>

      <a id="github-link" class="bar-btn gh-link-btn" href="https://github.com/laurorobles/Omnifon" target="_blank" rel="noopener noreferrer" title="Código fuente en GitHub">

        </svg>
        <span>GitHub</span>
      </a>

      <button id="toggle-cables" class="bar-btn" type="button">Atenuar cables</button>
      <button id="clear-cables" class="bar-btn" type="button">Sin cables</button>
      <button id="toggle-keyboard" class="bar-btn on" type="button">Teclado</button>

      <div id="lang-switch" class="switch-group dark" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" class="on">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>

      <button id="power" class="power" type="button" aria-pressed="false">
        <span class="lamp big"></span><span id="power-label">Encender</span>
      </button>
    </header>

    <div id="vst-daw-bar" class="vst-daw-bar" aria-label="DAW Sync">
      <span class="bar-label">DAW SYNC</span>
      <button id="daw-sync-btn" class="bar-btn" type="button">Sync</button>
      <select id="daw-div-select" class="daw-select" aria-label="Subdivisión">
        <option value="0">1/1</option>
        <option value="1">1/2</option>
        <option value="2">1/4</option>
        <option value="3">1/8</option>
        <option value="4">1/8T</option>
        <option value="5" selected>1/16</option>
        <option value="6">1/16T</option>
        <option value="7">1/32</option>
      </select>
      <button id="daw-transport-btn" class="bar-btn on" type="button">Transport</button>
      <span id="daw-bpm-badge" class="daw-bpm-badge">120.0 BPM</span>
    </div>

    <nav class="patch-strip" aria-label="Parches">
      <div class="patch-bar">
        <span id="presets-label" class="bar-label">Parches</span>
        <div class="patch-browser">
          <button id="patch-prev" class="bar-btn patch-nav-btn" type="button" title="Parche anterior" aria-label="Parche anterior">◀</button>
          <select id="patch-select" class="patch-select" aria-label="Seleccionar parche"></select>
          <button id="patch-next" class="bar-btn patch-nav-btn" type="button" title="Parche siguiente" aria-label="Parche siguiente">▶</button>
          <button id="open-catalog" class="bar-btn" type="button">Catálogo (25)</button>
        </div>
        <span id="patch-cat-badge" class="patch-cat-badge"></span>
      </div>
      <p id="patch-desc" class="patch-desc"></p>
    </nav>

    <div id="instrument" class="instrument">
      <div class="case">
        <div id="cabinet" class="cabinet"></div>
      </div>
      <div class="keybed-unit">
        <div id="keybed" class="keybed">
          <div id="keyboard" class="keyboard"></div>
        </div>
      </div>
    </div>

    <p id="footer-credits" class="credits"></p>

    <dialog id="info-modal" class="info-modal"></dialog>
    <dialog id="manual-modal" class="info-modal manual-dialog"></dialog>
    <dialog id="catalog-modal" class="info-modal catalog-dialog"></dialog>

    <script type="module" src="/src/main.ts"></script>
