  <body>
    <header class="topbar">
      <div class="brand">
        <h1>OMNIFÓN</h1>
        <p class="brand-meta">
          <span id="brand-subtitle">Raúl Pavón Sarrelangue · México · c. 1960</span>
          <span class="meta-sep">·</span>
          <span class="brand-credit">
            <span id="credit-by">Recreación virtual por</span>
            <a href="https://www.instagram.com/laurorobles/" target="_blank" rel="noopener noreferrer">@laurorobles</a>
          </span>
        </p>
      </div>

      <button id="open-info" class="bar-btn info-btn" type="button">
        <span class="info-icon" aria-hidden="true">i</span>
        <span id="info-label">Información</span>
      </button>

      <button id="toggle-cables" class="bar-btn" type="button">Atenuar cables</button>
      <button id="clear-cables" class="bar-btn" type="button">Sin cables</button>

      <div id="lang-switch" class="switch-group dark" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" class="on">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>

      <button id="power" class="power" type="button" aria-pressed="false">
        <span class="lamp big"></span><span id="power-label">Encender</span>
      </button>
    </header>

    <nav class="patch-strip" aria-label="Parches">
      <div class="patch-bar">
        <span id="presets-label" class="bar-label">Parches</span>
        <div id="patches" class="switch-group dark"></div>
      </div>
      <p id="patch-desc" class="patch-desc"></p>
    </nav>

    <div id="instrument" class="instrument">
      <div class="case">
        <div id="cabinet" class="cabinet"></div>
      </div>
      <div class="keybed-unit">
        <div id="keybed" class="keybed">
          <div id="keyboard" class="keyboard"></div>
        </div>
      </div>
    </div>

    <p id="footer-credits" class="credits"></p>
